<svg width="100%" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1200" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="footerClip">
      <rect width="1200" height="120" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .f-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 16px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .f-wave1 {
      animation: fSlide 11s linear infinite;
    }
    .f-wave2 {
      animation: fSlide 16s linear infinite reverse;
    }
    @keyframes fSlide {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-600px); }
    }
  </style>

  <g clip-path="url(#footerClip)">
    <rect width="1200" height="120" fill="url(#footerBg)"/>
    <g class="f-wave1" opacity="0.22">
      <path d="M0 30 Q 150 60, 300 30 T 600 30 T 900 30 T 1200 30 T 1500 30 T 1800 30 L 1800 0 L 0 0 Z" fill="#38bdf8"/>
    </g>
    <g class="f-wave2" opacity="0.25">
      <path d="M0 22 Q 150 2, 300 22 T 600 22 T 900 22 T 1200 22 T 1500 22 T 1800 22 L 1800 0 L 0 0 Z" fill="#f472b6"/>
    </g>
    <rect x="460" y="52" width="280" height="3" rx="1.5" fill="url(#lineGrad)" opacity="0.85"/>
    <text x="600" y="84" text-anchor="middle" class="f-text">thanks for stopping by — let's build something fun!</text>
  </g>
</svg>
