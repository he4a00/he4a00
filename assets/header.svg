<svg width="100%" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="rounded">
      <rect width="1200" height="280" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #ffffff;
      letter-spacing: -0.8px;
    }
    .subtitle {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 18px;
      fill: #a1a1aa;
      letter-spacing: 0.4px;
    }
    .pill-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #e4e4e7;
    }
    .float-slow {
      animation: floatY 6s ease-in-out infinite;
    }
    .float-med {
      animation: floatY 4.5s ease-in-out infinite reverse;
    }
    .pulse {
      animation: pulseOp 3s ease-in-out infinite;
    }
    .wave1 {
      animation: slideWave 11s linear infinite;
    }
    .wave2 {
      animation: slideWave 16s linear infinite reverse;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes pulseOp {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.95; }
    }
    @keyframes slideWave {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-600px); }
    }
  </style>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="1200" height="280" fill="url(#bgGrad)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="17.5" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

    <!-- Subtle Ambient Glows -->
    <circle cx="240" cy="70" r="240" fill="url(#glow1)" class="float-slow"/>
    <circle cx="960" cy="200" r="240" fill="url(#glow1)" class="float-med"/>

    <!-- Decorative floating monochrome tiles -->
    <g class="float-slow" opacity="0.8">
      <rect x="72" y="54" width="44" height="44" rx="12" fill="#18181b" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
      <text x="94" y="82" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
    </g>

    <g class="float-med" opacity="0.8">
      <rect x="1084" y="56" width="44" height="44" rx="12" fill="#18181b" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
      <text x="1106" y="84" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#ffffff">AI</text>
    </g>

    <!-- Monochrome Sparkles -->
    <path class="pulse" d="M235 64 L237.5 72 L245.5 74.5 L237.5 77 L235 85 L232.5 77 L224.5 74.5 L232.5 72 Z" fill="#ffffff"/>
    <path class="pulse" d="M965 70 L967 76 L973 78 L967 80 L965 86 L963 80 L957 78 L963 76 Z" fill="#d4d4d8"/>
    <circle cx="155" cy="175" r="3" fill="#a1a1aa" class="pulse"/>
    <circle cx="1030" cy="168" r="3.5" fill="#ffffff" class="pulse"/>

    <!-- Status Pill -->
    <g transform="translate(430, 38)">
      <rect width="340" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <circle cx="20" cy="16" r="4.5" fill="#ffffff" class="pulse"/>
      <text x="36" y="21" class="pill-text">building @ Folosy · open to cool ideas</text>
    </g>

    <!-- Main Heading -->
    <text x="600" y="140" text-anchor="middle" class="title">Hey, I'm Ahmed Hashem</text>

    <!-- Monochrome Accent Bar -->
    <rect x="460" y="158" width="280" height="3" rx="1.5" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" class="subtitle">Front-End · Mobile · AI-Integrated &amp; Local-First Systems</text>

    <!-- Animated Monochrome Waves -->
    <g class="wave1" opacity="0.09">
      <path d="M0 242 Q 150 216, 300 242 T 600 242 T 900 242 T 1200 242 T 1500 242 T 1800 242 L 1800 300 L 0 300 Z" fill="#ffffff"/>
    </g>
    <g class="wave2" opacity="0.14">
      <path d="M0 254 Q 150 274, 300 254 T 600 254 T 900 254 T 1200 254 T 1500 254 T 1800 254 L 1800 300 L 0 300 Z" fill="#a1a1aa"/>
    </g>
  </g>
</svg>
