<svg width="100%" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="rounded">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.4px;
    }
    .pill-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .float-slow {
      animation: floatY 6s ease-in-out infinite;
    }
    .float-med {
      animation: floatY 4.5s ease-in-out infinite reverse;
    }
    .pulse {
      animation: pulseOp 3.2s ease-in-out infinite;
    }
    .wave1 {
      animation: slideWave 10s linear infinite;
    }
    .wave2 {
      animation: slideWave 15s linear infinite reverse;
    }
    .spin-slow {
      transform-origin: center;
      transform-box: fill-box;
      animation: spin 14s linear infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulseOp {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
    @keyframes slideWave {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-600px); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bgGrad)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Ambient Glows -->
    <circle cx="200" cy="70" r="220" fill="url(#glow1)" class="float-slow"/>
    <circle cx="1010" cy="210" r="240" fill="url(#glow2)" class="float-med"/>

    <!-- Decorative floating code shapes -->
    <g class="float-slow" opacity="0.75">
      <rect x="70" y="55" width="44" height="44" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="92" y="83" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#38bdf8">&lt;/&gt;</text>
    </g>

    <g class="float-med" opacity="0.8">
      <rect x="1080" y="58" width="46" height="46" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
      <text x="1103" y="87" text-anchor="middle" font-family="monospace" font-size="19" font-weight="700" fill="#f472b6">AI</text>
    </g>

    <!-- Sparkles -->
    <path class="pulse" d="M235 65 L238 74 L247 77 L238 80 L235 89 L232 80 L223 77 L232 74 Z" fill="#38bdf8"/>
    <path class="pulse" d="M965 72 L967 79 L974 81 L967 83 L965 90 L963 83 L956 81 L963 79 Z" fill="#f472b6"/>
    <circle cx="155" cy="185" r="3.5" fill="#a855f7" class="pulse"/>
    <circle cx="1030" cy="175" r="4" fill="#38bdf8" class="pulse"/>
    <circle cx="910" cy="45" r="2.5" fill="#fde047" class="pulse"/>
    <circle cx="310" cy="42" r="2.5" fill="#f472b6" class="pulse"/>

    <!-- Status Pill -->
    <g transform="translate(430, 42)">
      <rect width="340" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="20" cy="16" r="5" fill="#4ade80" class="pulse"/>
      <text x="36" y="21" class="pill-text">building @ Folosy · open to cool ideas</text>
    </g>

    <!-- Main Heading -->
    <text x="600" y="148" text-anchor="middle" class="title">Hey, I'm Ahmed Hashem</text>

    <!-- Gradient Accent Bar -->
    <rect x="440" y="166" width="320" height="5" rx="2.5" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="600" y="206" text-anchor="middle" class="subtitle">Front-End · Mobile · AI-Integrated &amp; Local-First Systems</text>

    <!-- Animated Bottom Waves -->
    <g class="wave1" opacity="0.22">
      <path d="M0 255 Q 150 225, 300 255 T 600 255 T 900 255 T 1200 255 T 1500 255 T 1800 255 L 1800 320 L 0 320 Z" fill="#38bdf8"/>
    </g>
    <g class="wave2" opacity="0.28">
      <path d="M0 268 Q 150 292, 300 268 T 600 268 T 900 268 T 1200 268 T 1500 268 T 1800 268 L 1800 320 L 0 320 Z" fill="#a855f7"/>
    </g>
  </g>
</svg>
